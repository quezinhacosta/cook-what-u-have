name: CI - Qualidade e Testes

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

jobs:
  qualidade:
    name: Lint e Tipagem Estática (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Linter (Ruff)
        run: |
          ruff check .

      - name: Executar Verificação Estática de Tipos (Mypy)
        run: |
          mypy implementation interface ingestion tests

  testes:
    name: Suíte de Testes Automatizados (Pytest)
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pytest
        run: |
          pytest -v tests/
