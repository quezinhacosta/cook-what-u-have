[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cook-what-u-have"
version = "0.2.0"
description = "Motor funcional de recomendação de pratos com exclusão estrita de alérgenos e geração de lista de compras"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "recipe-scrapers>=15.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import organization)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
ignore = [
    "C417",    # Unnecessary map usage (FP requires map/filter)
    "PLC3002", # Unnecessary lambda call (FP uses higher-order lambda compositions)
    "E501",    # Line too long (managed by formatter and long formatted prompts)
    "BLE001",  # Do not catch blind Exception (resilient ingestion scraper fallback)
    "E731",    # Do not assign a lambda expression (project strictly adheres to lambda-based FP)
]

[tool.ruff.lint.isort]
known-first-party = ["implementation", "interface", "ingestion"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"
